name: Engine drift

# The development engine is the released carve-lang gem at an exact version
# (see Gemfile). A pin makes drift deliberate, but nothing notices when it has
# fallen behind, and a push-only CI reports the state of the day someone last
# touched the repo. That is not hypothetical here: two AST renames landed
# upstream, this repo was not pushed for five days, and the badge stayed green
# while a fresh install rendered bold text unstyled and dropped every footnote
# marker (#10).
#
# `drift` compares the pin with the newest carve-lang on RubyGems. `suite` runs
# the real suite against the pin. `consumer` installs the built gem and lets
# RubyGems resolve carve-lang through the gemspec range, which is what a user
# of this gem gets.
#
# Lag is reported, not gated. A pin that names no released version fails,
# because that build is already broken.

on:
  schedule:
    # 05:00 UTC daily, after the engine repos have had a night to settle.
    - cron: "0 5 * * *"
  workflow_dispatch:

# Every job declares timeout-minutes. Without one GitHub applies a 360-minute
# default, roughly 900x the median job in this org, so a hung step burns hours
# of runner time before anything stops it.
jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Compare the pinned version against RubyGems
        run: |
          set -euo pipefail
          pinned="$(sed -n 's/^ *gem "carve-lang", "=\{0,1\} *\([0-9][0-9.]*\)".*/\1/p' Gemfile | head -1)"
          if [ -z "${pinned}" ]; then
            echo "::error::no exact carve-lang version found in Gemfile; the engine dependency is not pinned"
            exit 1
          fi
          versions="$(curl -fsS --retry 3 https://rubygems.org/api/v1/versions/carve-lang.json)"
          if ! printf '%s' "${versions}" | jq -e --arg v "${pinned}" 'any(.[]; .number == $v)' > /dev/null; then
            echo "::error::Gemfile pins carve-lang ${pinned}, which RubyGems does not serve"
            exit 1
          fi
          latest="$(curl -fsS --retry 3 https://rubygems.org/api/v1/versions/carve-lang/latest.json | jq -r .version)"
          echo "pinned engine: carve-lang ${pinned}; newest on RubyGems: ${latest}"
          if [ "${pinned}" != "${latest}" ]; then
            echo "::warning::the pinned engine ${pinned} is behind carve-lang ${latest}"
          fi

  # The pin makes the ENGINE deterministic; everything else in the bundle still
  # floats, and this repo has no committed lockfile. A scheduled run of the real
  # suite is what catches a transitive gem changing under it.
  suite:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libclang (rb-sys bindgen)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Verify the engine this run measures
        run: bundle exec ruby script/verify_engine_pin.rb
      - name: Run tests
        run: bundle exec rake test

  # WHAT A CONSUMER GETS, WHICH NO OTHER RUN HERE ASKS.
  #
  # Every job above measures the version `Gemfile` pins, so the gemspec
  # range - the only thing a user of this gem resolves through - is exercised
  # nowhere. That is the cost of pinning: no pinned run ever meets a carve-lang
  # published after the pin, so an engine release that changed what the PDFs
  # look like would sit unnoticed until someone raised the pin by hand. Which is
  # the same silence the pin was added to end, pointing the other way.
  #
  # So this job installs the built gem into an isolated GEM_HOME and lets
  # RubyGems resolve carve-lang through the declared range, exactly as
  # `release.yml` does before publishing - the difference being that this one
  # runs daily rather than on a tag.
  consumer:
    name: The engine a consumer resolves
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install libclang (rb-sys bindgen)
        # BOUNDED AND RETRIED. A bare `apt-get` has no timeout, so a wedged
        # mirror hangs the job until the 6h runner limit with no output, which
        # is indistinguishable from a slow compile. Three tries, each capped at
        # 4 minutes: a hung mirror costs 12 minutes worst case and says so.
        run: |
          for attempt in 1 2 3; do
            if timeout 240 sudo apt-get update && timeout 240 sudo apt-get install -y libclang-dev; then
              exit 0
            fi
            echo "::warning::apt attempt ${attempt} failed or timed out; retrying"
            sleep 10
          done
          echo "::error::apt-get could not install libclang-dev after 3 attempts"
          exit 1
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Build the gem
        run: gem build carve-hexapdf.gemspec

      # No bundler and no Gemfile: this must resolve the way `gem install
      # carve-hexapdf` does for a stranger, which means through the gemspec
      # range and nothing else.
      #
      # GEM_PATH AS WELL AS GEM_HOME. GEM_HOME alone only redirects where a gem
      # is WRITTEN; RubyGems keeps its default directories in `Gem.path`, so a
      # carve-lang already present on the runner stays visible and `require`
      # takes the newest it can see rather than the one this install resolved.
      # Reproduced locally, where a stale carve-lang 0.2.0 sat in the user gem
      # directory: with GEM_HOME alone the probe loaded 0.2.0 and refused; with
      # GEM_PATH set it resolved 0.1.1 through the declared range, which is the
      # question being asked.
      #
      # GEM_PATH IS THE ISOLATED PREFIX ALONE, with no default directory on it.
      # #27 appended `Gem.default_dir` on the grounds that Ruby's own default
      # gems need it; measured on Ruby 3.2.3, they do not. Default gems resolve
      # through `Gem.default_specifications_dir`
      # (`/usr/lib/ruby/gems/3.2.0/specifications/default`), which derives from
      # neither `Gem.path` nor `Gem.default_dir` and is not even the same
      # directory as `Gem.default_dir` (`/var/lib/gems/3.2.0`) - `json`,
      # `openssl` and `psych` all still activate with `Gem.path` holding only
      # the prefix below.
      #
      # And the declared range is no backstop against what the residual left
      # open: a stray carve-lang INSIDE `>= 0.1.1, < 0.2.0` satisfies every
      # claim the probe checks, because the version is right and only the
      # location is wrong. Measured end to end with the real carve-lang 0.1.1
      # parked outside the prefix - `gem install` reported "5 gems installed"
      # with carve-lang not among them, having treated the dependency as
      # already met, and the probe then rendered a PDF through an engine this
      # step never installed. The probe now asserts where the engine loaded
      # from, so a leak fails there too rather than resting on this line.
      - name: Install it the way a consumer would
        run: |
          export GEM_HOME="${RUNNER_TEMP}/consumer"
          export GEM_PATH="${GEM_HOME}"
          gem install --no-document ./carve-hexapdf-*.gem
          {
            echo "GEM_HOME=${GEM_HOME}"
            echo "GEM_PATH=${GEM_PATH}"
          } >> "$GITHUB_ENV"

      - name: Render through the engine that install resolved
        run: ruby script/consumer_engine_probe.rb
