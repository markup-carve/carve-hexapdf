# This gem was tagged v0.1.0 and released on GitHub, and RubyGems has never
# served it. The workflow that would have published it landed ten commits AFTER
# that tag (#5), so the tag it was meant to react to had already been pushed and
# this file has never run once.
#
# THE GATE RUNS BEFORE PUBLISH, AND PUBLISH SITS BEHIND IT VIA `needs:`. The
# previous version of this file had no gate at all: it built the gem and pushed
# it, with no test run, no check that the tag matched lib/carve/hexapdf/version.rb,
# and no check that the changelog described the version being shipped.
#
# A DISPATCH IS A REHEARSAL, NOT A PUBLISH. The previous version published for
# real on workflow_dispatch, and its own comment recommended dispatching it to
# ship the old tag - an irreversible first publish with nothing verified.
# RubyGems does not let a version be replaced.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

jobs:
  guard:
    name: The tag agrees with the gem
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: version.rb matches the tag
        run: |
          got="$(ruby -r ./lib/carve/hexapdf/version -e 'print Carve::Hexapdf::VERSION')"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "rehearsal: no tag exists, using version.rb ($got)"
            tag="$got"
          else
            tag="${GITHUB_REF_NAME#v}"
          fi
          [ "$got" = "$tag" ] \
            || { echo "::error::version.rb declares '$got', tag is '$tag'"; exit 1; }
          echo "version $got"

      - name: The changelog describes this version
        run: |
          v="${GITHUB_REF_NAME#v}"
          [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            && v="$(ruby -r ./lib/carve/hexapdf/version -e 'print Carve::Hexapdf::VERSION')"
          grep -qE "^## \[?${v}\]? - " CHANGELOG.md \
            || { echo "::error::CHANGELOG.md has no section for ${v}"; exit 1; }

  test:
    name: Test and inspect the built gem
    runs-on: ubuntu-latest
    needs: [guard]
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - run: bundle exec rake

      # `spec.files` is a Dir[] glob, so a rename or a moved directory silently
      # ships a gem missing the code it is supposed to carry. Measure the built
      # artifact, not the working tree.
      - name: The gem carries the library
        run: |
          gem build carve-hexapdf.gemspec
          gem="$(ls carve-hexapdf-*.gem)"
          listing="$(tar -xOf "$gem" data.tar.gz | tar -tzf -)"
          missing=0
          for want in lib/carve/hexapdf.rb lib/carve/hexapdf/version.rb README.md LICENSE CHANGELOG.md; do
            printf '%s\n' "$listing" | grep -qx "$want" \
              || { echo "::error::the gem is missing $want"; missing=1; }
          done
          n="$(printf '%s\n' "$listing" | grep -c '^lib/.*\.rb$')"
          [ "$n" -ge 3 ] \
            || { echo "::error::only $n ruby file(s) under lib/"; missing=1; }
          echo "$n ruby files under lib/"
          exit $missing

      # What a consumer gets. A gem that builds can still fail to load.
      #
      # Installed into an ISOLATED GEM_HOME, which is what makes the step below
      # mean anything: RubyGems then resolves carve-lang through the range the
      # gemspec declares rather than through the carve-rb revision `Gemfile`
      # pins for development. Those are different engines, and this repository
      # has already been bitten by the difference (#10).
      #
      # GEM_PATH as well as GEM_HOME: GEM_HOME alone only redirects where a gem
      # is written, and RubyGems keeps its default directories in `Gem.path`, so
      # a carve-lang already on the runner would stay visible to the step below.
      # It is the isolated prefix ALONE - this is the same shape the `consumer`
      # job in `engine-drift.yml` carries, the reasoning is spelled out there,
      # and the two are corrected together so they cannot drift apart.
      - name: The built gem installs and loads
        run: |
          gem build carve-hexapdf.gemspec
          export GEM_HOME="${RUNNER_TEMP}/consumer"
          export GEM_PATH="${GEM_HOME}"
          gem install --no-document ./carve-hexapdf-*.gem
          ruby -e 'require "carve/hexapdf"; print "loaded carve-hexapdf ", Carve::Hexapdf::VERSION, "\n"'
          {
            echo "GEM_HOME=${GEM_HOME}"
            echo "GEM_PATH=${GEM_PATH}"
          } >> "$GITHUB_ENV"

      # THE GATE A FLOOR AND A CEILING NEED. Both are claims about what a
      # consumer resolves, and nothing in this repository checked either until
      # now. The probe lives in `script/consumer_engine_probe.rb` because the
      # daily `consumer` job in `.github/workflows/engine-drift.yml` asks the
      # identical question - this one before publishing, that one before a user
      # finds out - and two copies of a check drift apart.
      - name: The engine that install resolved still draws the page
        run: ruby script/consumer_engine_probe.rb

  publish:
    name: Publish to RubyGems
    runs-on: ubuntu-latest
    needs: [guard, test]
    # OIDC TRUSTED PUBLISHING, not an API key.
    #
    # This gemspec sets `rubygems_mfa_required => "true"`, and it is the only
    # gem in the org that does. RubyGems honours that on every push: with MFA
    # off the account it answered "Rubygem requires owners to enable MFA", and
    # with MFA on it answered "no OTP code provided" - a prompt CI cannot fill.
    # An API key cannot satisfy an MFA-required gem unattended, so the key was
    # never going to work here however it was scoped.
    #
    # Trusted publishing replaces it: GitHub mints a short-lived OIDC token for
    # this exact repository, workflow and environment, RubyGems exchanges it for
    # a credential valid for minutes, and MFA is satisfied by the provenance of
    # the request rather than by a human typing a code. It also removes the
    # long-lived RUBYGEMS_API_KEY from the repository entirely, which is the
    # larger win: a leaked key publishes any gem the account owns, and there is
    # nothing to leak here.
    #
    # `id-token: write` is required and never granted implicitly.
    permissions:
      contents: read
      id-token: write
    steps:
      # GATE: the notes are not the workflow's to write. A CHANGELOG entry is
      # deliberately one or two lines for a contributor, which makes poor
      # release notes for a reader deciding whether to upgrade. A human writes
      # the draft first and this refuses to publish without one.
      #
      # Found by listing rather than `gh release view <tag>`: a draft's tag is
      # not a git ref, so addressing one by tag can match nothing, change
      # nothing and still exit 0.
      - name: A release draft for this tag exists and has notes
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release="$(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate \
            --jq "[.[] | select(.tag_name == \"$GITHUB_REF_NAME\")] | first")"
          if [ -z "$release" ]; then
            echo "::error::no release for $GITHUB_REF_NAME. Write the notes first:" \
                 "gh release create $GITHUB_REF_NAME --draft --notes-file NOTES.md"
            exit 1
          fi
          body="$(printf '%s' "$release" | jq -r '.body // ""' | tr -d '[:space:]')"
          [ -n "$body" ] \
            || { echo "::error::the release for $GITHUB_REF_NAME has no notes"; exit 1; }
          printf '%s' "$release" | jq -r '"draft=\(.draft) tag=\(.tag_name)"'

      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true
      - run: gem build carve-hexapdf.gemspec

      # Exchanges the OIDC token for a RubyGems credential and exports it for
      # the push below. NOT rubygems/release-gem, which wraps this and then runs
      # `bundle exec rake release` - that builds its own gem AND creates and
      # pushes a git tag, so on a tag-triggered run it would try to re-create
      # the tag that triggered it. This action is the half that matters.
      #
      # Skipped on a dispatch: a rehearsal must not mint a publishing
      # credential, and there is nothing for it to authenticate.
      - name: Exchange the OIDC token for a RubyGems credential
        if: github.event_name != 'workflow_dispatch'
        uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Publish to RubyGems
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "::notice::rehearsal - nothing was published to RubyGems"
            ls -l carve-hexapdf-*.gem
          else
            gem push carve-hexapdf-*.gem
          fi
