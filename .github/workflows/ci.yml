name: CI

on:
  push:
    branches: [main]
  pull_request:

# Every job declares timeout-minutes. Without one GitHub applies a 360-minute
# default, roughly 900x the median job in this org, so a hung step burns hours
# of runner time before anything stops it.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.1", "3.2", "3.3", "3.4"]

    steps:
      - uses: actions/checkout@v7

      # The Carve 0.2 engine is carve-rb built from git: the runner's Rust
      # toolchain compiles it, and rb-sys needs libclang for its bindings.
      - name: Install libclang
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libclang-dev

      # Ruby 3.2's headers use `bool` without stdbool.h under the runner's
      # libclang, which fails rb-sys's bindgen pass on that leg only.
      - uses: ruby/setup-ruby@v1
        env:
          BINDGEN_EXTRA_CLANG_ARGS: ${{ matrix.ruby == '3.2' && '-include stdbool.h' || '' }}
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true

      # A PIN NOTHING VERIFIES IS NOT A PIN. `Gemfile` pins carve-lang to an
      # exact release, but until now nothing read it back - and this suite
      # cannot stand in for that, because it is 82 runs green against carve-lang
      # 0.1.0 too: most of it hands `render_ast` a Hash built in the test rather
      # than one the engine produced. This states the engine behind the result
      # and fails when it is not the pinned one.
      - name: Verify the engine this run measures
        run: bundle exec ruby script/verify_engine_pin.rb

      - name: Run tests
        run: bundle exec rake test
